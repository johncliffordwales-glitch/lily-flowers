<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Slow Bloom — Lily Bouquet</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#030604;color:#f8eee8}body{overflow:hidden}
main{height:100svh;min-height:480px;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 72%,#17251a 0%,#050806 58%,#010201 100%)}
header{position:absolute;top:calc(18px + env(safe-area-inset-top));left:0;right:0;text-align:center;z-index:2;pointer-events:none;padding:0 12px}
h1{font:italic clamp(27px,6vw,42px) Georgia,serif;font-weight:400;margin:0;text-shadow:0 2px 20px #000}
header p{font:10px monospace;letter-spacing:.22em;color:#a7b49f;text-transform:uppercase;margin-top:10px}
svg{width:100%;height:100%;position:absolute;inset:0}
.stem{fill:none;stroke:#456e3d;stroke-width:3;stroke-linecap:round}
.leaf{fill:url(#leaf);stroke:#4d713d;stroke-width:.8}.vein{fill:none;stroke:#a5c17d;stroke-width:.7;opacity:.6}
.petal{stroke:#d98ca2;stroke-width:.7;stroke-linejoin:round;transform-box:fill-box;transform-origin:50% 100%;transform:rotate(var(--tilt)) scaleY(.035);animation:open 8s cubic-bezier(.2,.7,.2,1) var(--delay) forwards}
.outer{fill:url(#outer)}.inner{fill:url(#inner)}
.stamen,.anther{opacity:0;animation:appear 1.5s ease-out 7s forwards}.stamen{stroke:#e4b765;stroke-width:1.5;stroke-linecap:round}.anther{fill:#e9bd65}
@keyframes open{0%{transform:rotate(var(--tilt)) scaleY(.035)}45%{transform:rotate(calc(var(--tilt)*.5)) scaleY(.55)}100%{transform:rotate(0) scaleY(1)}}
@keyframes appear{to{opacity:1}}.bloom{transform-box:fill-box;transform-origin:center;animation:sway 6s ease-in-out infinite alternate}
@keyframes sway{to{transform:rotate(1deg)}}
.controls{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:0 10px}
button{background:#101a12;color:#e8eee4;border:1px solid #536b50;border-radius:99px;padding:12px 14px;font:12px monospace}
.note{position:absolute;bottom:75px;width:100%;text-align:center;color:#899784;font:10px monospace;letter-spacing:.12em}
@media(prefers-reduced-motion:reduce){.petal,.stamen,.anther{animation-duration:.01ms;animation-delay:0s}}
</style></head>
<body><main>
<header><h1>For you, in bloom</h1><p>a little patience, a little beauty</p></header>
<svg viewBox="0 0 400 720" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Pink lilies slowly opening in a bouquet">
<defs>
<linearGradient id="outer" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7c4ce"/><stop offset=".38" stop-color="#d66f91"/><stop offset=".72" stop-color="#a93f67"/><stop offset="1" stop-color="#612a43"/></linearGradient>
<linearGradient id="inner" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#fff0e6"/><stop offset=".28" stop-color="#f3b5c6"/><stop offset=".68" stop-color="#d85d87"/><stop offset="1" stop-color="#7c294b"/></linearGradient>
<linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7eaa58"/><stop offset=".5" stop-color="#315b32"/><stop offset="1" stop-color="#132a1b"/></linearGradient>
<radialGradient id="glow"><stop stop-color="#d57d9b" stop-opacity=".17"/><stop offset="1" stop-color="#d57d9b" stop-opacity="0"/></radialGradient>
</defs>
<ellipse cx="200" cy="570" rx="165" ry="110" fill="url(#glow)"/>
<path d="M35 626 Q200 610 365 626 Q250 644 35 626" fill="#152018" opacity=".6"/>
<g class="stem"><path d="M200 630 Q175 460 118 300"/><path d="M205 630 Q220 435 245 270"/><path d="M200 630 Q198 400 198 210"/><path d="M202 630 Q255 460 290 360"/><path d="M198 630 Q140 490 75 390"/><path d="M205 630 Q185 465 160 350"/></g>
<g>
<path class="leaf" d="M191 548 Q117 520 90 465 Q153 480 191 548Z"/><path class="vein" d="M191 548 Q139 500 90 465"/>
<path class="leaf" d="M205 566 Q280 515 305 454 Q243 477 205 566Z"/><path class="vein" d="M205 566 Q256 505 305 454"/>
<path class="leaf" d="M181 500 Q111 468 105 418 Q158 444 181 500Z"/><path class="vein" d="M181 500 Q139 451 105 418"/>
<path class="leaf" d="M215 482 Q275 450 285 402 Q239 425 215 482Z"/><path class="vein" d="M215 482 Q256 433 285 402"/>
<path class="leaf" d="M192 444 Q145 411 145 375 Q183 394 192 444Z"/><path class="vein" d="M192 444 Q166 405 145 375"/>
<path class="leaf" d="M218 420 Q255 388 258 350 Q226 370 218 420Z"/><path class="vein" d="M218 420 Q242 381 258 350"/>
<path class="leaf" d="M160 590 Q95 565 75 525 Q126 536 160 590Z"/><path class="vein" d="M160 590 Q111 552 75 525"/>
<path class="leaf" d="M222 601 Q286 578 326 532 Q265 542 222 601Z"/><path class="vein" d="M222 601 Q277 558 326 532"/>
</g>
<!-- Flower 1 -->
<g class="bloom" transform="translate(118 300) scale(.82)">
<g class="petal outer" style="--tilt:-28deg;--delay:1.1s"><path d="M0 0 C-43 -19 -48 -68 -8 -105 C-2 -68 6 -27 0 0Z"/></g>
<g class="petal inner" style="--tilt:24deg;--delay:1.5s"><path d="M0 0 C-20 -43 4 -91 31 -108 C29 -64 19 -22 0 0Z"/></g>
<g class="petal outer" style="--tilt:-8deg;--delay:1.8s"><path d="M0 0 C-5 -48 30 -82 57 -78 C43 -43 21 -12 0 0Z"/></g>
<g class="petal inner" style="--tilt:42deg;--delay:2.1s"><path d="M0 0 C-46 -3 -75 -38 -67 -66 C-34 -54 -10 -25 0 0Z"/></g>
<g class="petal outer" style="--tilt:-45deg;--delay:2.4s"><path d="M0 0 C15 -38 -7 -79 -33 -92 C-32 -51 -17 -17 0 0Z"/></g>
<g class="petal inner" style="--tilt:12deg;--delay:2.7s"><path d="M0 0 C-31 -18 -35 -50 -20 -70 C-3 -48 3 -19 0 0Z"/></g>
<path class="stamen" d="M0 0 L-20 -43 M0 0 L-4 -51 M0 0 L14 -45 M0 0 L25 -35"/>
<g class="anther"><ellipse cx="-20" cy="-43" rx="4" ry="2.3"/><ellipse cx="-4" cy="-51" rx="4" ry="2.3"/><ellipse cx="14" cy="-45" rx="4" ry="2.3"/><ellipse cx="25" cy="-35" rx="4" ry="2.3"/></g>
</g>
<!-- Flower 2 -->
<g class="bloom" transform="translate(245 270) scale(.66)">
<g class="petal outer" style="--tilt:-25deg;--delay:2.4s"><path d="M0 0 C-43 -19 -48 -68 -8 -105 C-2 -68 6 -27 0 0Z"/></g>
<g class="petal inner" style="--tilt:28deg;--delay:2.8s"><path d="M0 0 C-20 -43 4 -91 31 -108 C29 -64 19 -22 0 0Z"/></g>
<g class="petal outer" style="--tilt:-8deg;--delay:3.1s"><path d="M0 0 C-5 -48 30 -82 57 -78 C43 -43 21 -12 0 0Z"/></g>
<g class="petal inner" style="--tilt:42deg;--delay:3.4s"><path d="M0 0 C-46 -3 -75 -38 -67 -66 C-34 -54 -10 -25 0 0Z"/></g>
<g class="petal outer" style="--tilt:-45deg;--delay:3.7s"><path d="M0 0 C15 -38 -7 -79 -33 -92 C-32 -51 -17 -17 0 0Z"/></g>
<g class="petal inner" style="--tilt:12deg;--delay:4s"><path d="M0 0 C-31 -18 -35 -50 -20 -70 C-3 -48 3 -19 0 0Z"/></g>
<path class="stamen" style="animation-delay:7.2s" d="M0 0 L-20 -43 M0 0 L-4 -51 M0 0 L14 -45 M0 0 L25 -35"/>
<g class="anther" style="animation-delay:7.2s"><ellipse cx="-20" cy="-43" rx="4" ry="2.3"/><ellipse cx="-4" cy="-51" rx="4" ry="2.3"/><ellipse cx="14" cy="-45" rx="4" ry="2.3"/><ellipse cx="25" cy="-35" rx="4" ry="2.3"/></g>
</g>
<!-- Flower 3 -->
<g class="bloom" transform="translate(198 210) scale(.9)">
<g class="petal outer" style="--tilt:-28deg;--delay:3.4s"><path d="M0 0 C-43 -19 -48 -68 -8 -105 C-2 -68 6 -27 0 0Z"/></g>
<g class="petal inner" style="--tilt:24deg;--delay:3.8s"><path d="M0 0 C-20 -43 4 -91 31 -108 C29 -64 19 -22 0 0Z"/></g>
<g class="petal outer" style="--tilt:-8deg;--delay:4.1s"><path d="M0 0 C-5 -48 30 -82 57 -78 C43 -43 21 -12 0 0Z"/></g>
<g class="petal inner" style="--tilt:42deg;--delay:4.4s"><path d="M0 0 C-46 -3 -75 -38 -67 -66 C-34 -54 -10 -25 0 0Z"/></g>
<g class="petal outer" style="--tilt:-45deg;--delay:4.7s"><path d="M0 0 C15 -38 -7 -79 -33 -92 C-32 -51 -17 -17 0 0Z"/></g>
<g class="petal inner" style="--tilt:12deg;--delay:5s"><path d="M0 0 C-31 -18 -35 -50 -20 -70 C-3 -48 3 -19 0 0Z"/></g>
<path class="stamen" style="animation-delay:8s" d="M0 0 L-20 -43 M0 0 L-4 -51 M0 0 L14 -45 M0 0 L25 -35"/>
<g class="anther" style="animation-delay:8s"><ellipse cx="-20" cy="-43" rx="4" ry="2.3"/><ellipse cx="-4" cy="-51" rx="4" ry="2.3"/><ellipse cx="14" cy="-45" rx="4" ry="2.3"/><ellipse cx="25" cy="-35" rx="4" ry="2.3"/></g>
</g>
</svg>
<div class="note">A FLOWER DOESN'T RUSH</div>
<div class="controls"><button id="restart">↻ Bloom again</button><button id="pause">Ⅱ Pause</button><button id="full">⛶ Fullscreen</button></div>
</main>
<script>
const restart=document.querySelector('#restart'),pause=document.querySelector('#pause');
restart.addEventListener('click',()=>{document.querySelectorAll('.petal,.stamen,.anther').forEach(el=>{el.style.animation='none';void el.getBoundingClientRect();el.style.animation='';});pause.textContent='Ⅱ Pause';document.querySelectorAll('.petal,.stamen,.anther,.bloom').forEach(el=>el.style.animationPlayState='running');});
pause.addEventListener('click',()=>{const paused=pause.dataset.paused!=='yes';pause.dataset.paused=paused?'yes':'no';document.querySelectorAll('.petal,.stamen,.anther,.bloom').forEach(el=>el.style.animationPlayState=paused?'paused':'running');pause.textContent=paused?'▶ Resume':'Ⅱ Pause';});
document.querySelector('#full').addEventListener('click',async()=>{try{if(!document.fullscreenElement)await document.querySelector('main').requestFullscreen();else await document.exitFullscreen();}catch(e){}});
</script></body></html>
